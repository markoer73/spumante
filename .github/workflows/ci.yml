# SPDX-License-Identifier: LGPL-2.1-or-later
name: Wine Parity Differential Conformance, Security & Lint CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Periodic weekly security & parity audit (Mondays at 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  parity-check:
    name: Differential Parity & Security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run WineHQ Style, Markdown, and Canonical Script Linter
        run: ./scripts/test.sh --lint

      - name: Run 4-Gate Security Audit (Secrets, Clean-Room, SAST, ASan+UBSan)
        run: ./scripts/test.sh --security --dll bcrypt --test test_symmetric_key

      - name: Surgically Build BCrypt Conformance Target
        run: ./scripts/build.sh --dll bcrypt --test test_symmetric_key

      - name: Run Targeted Differential Conformance Test
        run: ./scripts/test.sh --dll bcrypt --test test_symmetric_key

      - name: Run Upstream Wine winetest & A/B Anti-Regression Suite (bcrypt)
        run: ./scripts/test.sh --winetest --dll bcrypt

      - name: Surgically Build & Test NTDLL Apple Silicon & NTSync Parity
        run: |
          ./scripts/build.sh --dll ntdll --test test_apple_silicon_parity
          ./scripts/test.sh --dll ntdll --test test_apple_silicon_parity
          ./scripts/test.sh --security --dll ntdll --test test_apple_silicon_parity
          ./scripts/build.sh --dll ntdll --test test_ntsync_macos_parity
          ./scripts/test.sh --dll ntdll --test test_ntsync_macos_parity
          ./scripts/test.sh --security --dll ntdll --test test_ntsync_macos_parity
          ./scripts/test.sh --winetest --dll ntdll

      - name: Surgically Build & Test KernelBase Synchronization & Utility API Parity
        run: |
          ./scripts/build.sh --dll kernelbase --test test_wait_on_address
          ./scripts/test.sh --dll kernelbase --test test_wait_on_address
          ./scripts/test.sh --security --dll kernelbase --test test_wait_on_address
          ./scripts/build.sh --dll kernelbase --test test_win32_utility_apis
          ./scripts/test.sh --dll kernelbase --test test_win32_utility_apis
          ./scripts/test.sh --security --dll kernelbase --test test_win32_utility_apis
          ./scripts/test.sh --winetest --dll kernelbase

      - name: Surgically Build & Test winemac.drv Windowing, Multi-Monitor & Metal Parity
        run: |
          ./scripts/build.sh --dll winemac.drv --test test_winemac_parity
          ./scripts/test.sh --dll winemac.drv --test test_winemac_parity
          ./scripts/test.sh --security --dll winemac.drv --test test_winemac_parity
          ./scripts/test.sh --winetest --dll winemac.drv

      - name: Surgically Build & Test mfplat Core Media Foundation & VideoToolbox Parity
        run: |
          ./scripts/build.sh --dll mfplat --test test_mfplat_parity
          ./scripts/test.sh --dll mfplat --test test_mfplat_parity
          ./scripts/test.sh --security --dll mfplat --test test_mfplat_parity
          ./scripts/test.sh --winetest --dll mfplat

      - name: Surgically Build & Test qcap AVFoundation Video Capture & CLSID_AudioRecord Parity
        run: |
          ./scripts/build.sh --dll qcap --test test_qcap_parity
          ./scripts/test.sh --dll qcap --test test_qcap_parity
          ./scripts/test.sh --security --dll qcap --test test_qcap_parity
          ./scripts/test.sh --winetest --dll qcap

      - name: Surgically Build & Test d2d1 Direct2D Primitives & vkd3d-shader MSL Parity
        run: |
          ./scripts/build.sh --dll d2d1 --test test_d2d1_msl_parity
          ./scripts/test.sh --dll d2d1 --test test_d2d1_msl_parity
          ./scripts/test.sh --security --dll d2d1 --test test_d2d1_msl_parity
          ./scripts/test.sh --winetest --dll d2d1

      - name: Run Full Architecture & Harness Unit Suite
        run: python3 -m unittest -v tests/unit/test_harness_suite.py

